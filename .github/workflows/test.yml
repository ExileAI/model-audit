name: self-test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scanner self-tests
        run: python3 tests/test_scanner.py
      - name: Run safetensors self-tests
        run: python3 tests/test_safetensors.py
      - name: Run report rendering self-tests
        run: python3 tests/test_report.py
      - name: Run CLI and rubric regression tests
        run: python3 tests/test_cli.py
      - name: Smoke-test CLI help
        run: |
          python3 model_audit.py --help > /dev/null
          python3 report.py --help > /dev/null
